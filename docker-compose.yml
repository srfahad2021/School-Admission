services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_pw
      POSTGRES_DB: school_admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=school_admission;Username=school;Password=school_pw"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:80"
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_pw
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    environment:
      TEST_DB_CONNECTION: "Host=postgres-test;Port=5432;Database=postgres;Username=school;Password=school_pw"
    depends_on:
      postgres-test:
        condition: service_healthy
volumes:
  pgdata: